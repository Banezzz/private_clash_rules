; Proxy group definitions

; ========== Core selectors ==========
custom_proxy_group=🚀 节点选择`select`[]🚀 手动切换`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`[]🔀 双入口LB`[]🫡 自建节点`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇲🇾 马来西亚节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]DIRECT
custom_proxy_group=🚀 手动切换`select`.*
; Self-built exit selector: dual-entry LB first, then Tencent private-network nodes only
custom_proxy_group=🫡 自建节点`select`[]🔀 双入口LB`(腾讯云内网)`

; ========== Dual-entry / auto / failover / full-set LB ==========
; Subconverter emits consistent-hashing for load-balance groups.
custom_proxy_group=🔀 双入口LB`load-balance`(腾讯云内网)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔯 故障转移`fallback`.*`https://www.gstatic.com/generate_204`300,,50
; Full-set LB: Clash default consistent-hashing (same destination sticks).
custom_proxy_group=🔮 负载均衡`load-balance`.*`https://www.gstatic.com/generate_204`300,,50,consistent-hashing

